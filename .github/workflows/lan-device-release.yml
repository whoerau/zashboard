name: Publish LAN Device Release

on:
  push:
    branches:
      - feat/lan-device-filter

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'whoerau/zashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run type-check
          pnpm run build:no-fonts

      - name: Zip dist
        run: |
          cd dist
          zip -qr ../dist.zip .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lan-device-dist-${{ github.sha }}
          path: dist.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: github.repository == 'whoerau/zashboard'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: lan-device-dist-${{ github.sha }}

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: lan-device-filter-${{ github.sha }}
        run: |
          current_head_sha() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha
          }

          if [ "$GITHUB_SHA" != "$(current_head_sha)" ]; then
            echo "A newer branch commit exists; skipping this stale release."
            exit 0
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release is already published and immutable; leaving it unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist.zip --clobber
            gh release edit "$RELEASE_TAG" --title "lan-device-filter $GITHUB_SHA" --notes "Built from $GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" dist.zip --title "lan-device-filter $GITHUB_SHA" --notes "Built from $GITHUB_SHA" --target "$GITHUB_SHA" --draft
          fi

          # Verify the uploaded bytes before publishing or moving latest.
          # 发布或移动 latest 前，先验证上传资产的实际字节。
          gh release download "$RELEASE_TAG" --pattern dist.zip --output "$RUNNER_TEMP/published-dist.zip" --clobber
          cmp --silent dist.zip "$RUNNER_TEMP/published-dist.zip"

          if [ "$GITHUB_SHA" != "$(current_head_sha)" ]; then
            echo "A newer branch commit exists; leaving this release unpromoted."
            exit 0
          fi

          # Promote only after the immutable release and asset are complete.
          # 不可变发布及资产全部就绪后，才原子切换 latest 指针。
          gh release edit "$RELEASE_TAG" --draft=false --latest
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = "$RELEASE_TAG"
